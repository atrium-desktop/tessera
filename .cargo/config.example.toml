# Example Cargo configuration for local development.
#
# To use this configuration locally:
#   cp .cargo/config.example.toml .cargo/config.toml
#
# Note: `.cargo/config.toml` is ignored by Git, allowing individual developers
# to customize their local toolchain and build acceleration settings without
# affecting other environments.

[alias]
xtask = "run --package xtask --"

[build]
# Optional compiler cache wrapper. Requires `sccache` in your PATH.
# Note: sccache is incompatible with `incremental = true` in profile.dev
# (yields 0% cache hits). If using sccache, set `incremental = false` in
# Cargo.toml [profile.dev]; otherwise keep this commented out for native
# rustc incremental compilation without wrapper IPC overhead.
# rustc-wrapper = "sccache"

# Optional fast linker & v0 symbol mangling for Linux x86_64 targets.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "symbol-mangling-version=v0", "-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "symbol-mangling-version=v0", "-C", "link-arg=-fuse-ld=mold"]

# When developing against a local checkout of Optics, append the source patches below:
# [patch."https://github.com/ming2k/optics"]
# flux = { path = "../optics/bindings/crates/flux" }
# flux-sys = { path = "../optics/bindings/crates/flux-sys" }
# vista = { path = "../optics/bindings/crates/vista" }
# vista-sys = { path = "../optics/bindings/crates/vista-sys" }
# glyph = { path = "../optics/bindings/crates/glyph" }
# glyph-sys = { path = "../optics/bindings/crates/glyph-sys" }
# transit = { path = "../optics/bindings/crates/transit" }
# lens = { path = "../optics/bindings/crates/lens" }
# lens-sys = { path = "../optics/bindings/crates/lens-sys" }
# reticle = { path = "../optics/bindings/crates/reticle" }
# reticle-sys = { path = "../optics/bindings/crates/reticle-sys" }
# iris = { path = "../optics/bindings/crates/iris" }
# iris-sys = { path = "../optics/bindings/crates/iris-sys" }
