[package]
name = "tessera-tests"
description = "Root integration and end-to-end test suites for the Tessera workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false
autobins = false
autoexamples = false
autobenches = false

[features]
default = ["native"]
# Tests that cross a native boundary (Wayland, gfx/optics-ui, or a real binary
# built from the compositor stack). Native-free CI runs this package with
# --no-default-features.
native = [
    "dep:tessera-composite",
    "dep:tessera-shell",
    "dep:optics-gfx-sys",
    "dep:optics-ui-sys",
    "dep:tessera-dbus",
    "dep:tessera-cast",
]

[dependencies]
libc.workspace = true
serde_json.workspace = true
tempfile.workspace = true

tessera-audit.workspace = true
tessera-authority.workspace = true
tessera-control.workspace = true
tessera-config.workspace = true
tessera-desktop.workspace = true
tessera-env.workspace = true
tessera-ipc.workspace = true
tessera-launch-services.workspace = true
tessera-mcp.workspace = true
tessera-primitives.workspace = true
tessera-protocol.workspace = true
tessera-test-support.workspace = true

# Casting suites: a fake NetworkManager on a private bus (zbus) drives the
# caster's radio; gated with `native` alongside the other zbus suites.
tessera-cast = { workspace = true, optional = true }
tessera-composite = { workspace = true, optional = true }
tessera-shell = { workspace = true, optional = true, default-features = false, features = [
    "chrome-tray",
] }
# Native `-sys` edges are not linked from the suites directly; they publish the
# local Optics rpaths that the test harnesses must re-emit (see `build.rs`).
optics-gfx-sys = { workspace = true, optional = true }
optics-ui-sys = { workspace = true, optional = true }
tessera-dbus = { workspace = true, optional = true }

[[test]]
name = "integration"
path = "integration/main.rs"

[[test]]
name = "e2e"
path = "e2e/main.rs"

[package.metadata.cargo-machete]
# Native rpath metadata for the test harnesses, plus the shared test
# infrastructure that only `tests/common/mod.rs` re-exports.
ignored = ["optics-gfx-sys", "optics-ui-sys", "tessera-test-support"]

[lints]
workspace = true
