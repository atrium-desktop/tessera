[workspace]
resolver = "3"
# Package boundaries are checked from Cargo metadata by `cargo xtask check-boundaries`.
members = ["crates/*", "tests", "xtask"]
default-members = [
    "crates/tessera",
    "crates/tessera-control",
    "crates/tessera-lock",
    "crates/tessera-idle",
    "crates/tessera-cast",
    "crates/tessera-network",
    "crates/tessera-network-system",
    "crates/tessera-settings",
    "tests",
]

[workspace.package]
version = "0.0.104"
edition = "2024"
# Workspace crates contain MIT-licensed source, including the bundled cursor
# art under assets/cursors (original, generated in-tree).
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/atrium-desktop/tessera"

[workspace.dependencies]
# The compositor package is a dependency only of the root external test suite,
# which exercises its binary entry points.
tessera = { path = "crates/tessera" }
tessera-primitives = { path = "crates/tessera-primitives" }
tessera-image = { path = "crates/tessera-image" }
tessera-assets = { path = "crates/tessera-assets" }
tessera-launch-services = { path = "crates/tessera-launch-services" }
tessera-desktop = { path = "crates/tessera-desktop" }
tessera-ipc = { path = "crates/tessera-ipc" }
tessera-dbus = { path = "crates/tessera-dbus" }
tessera-wl-client = { path = "crates/tessera-wl-client" }
tessera-protocol = { path = "crates/tessera-protocol" }
tessera-audit = { path = "crates/tessera-audit" }
# optics-gfx (rendering engine) + optics-ui (immediate-mode UI engine) Rust bindings.
# Canonical and production builds statically link the Optics archives by default
# via the `static` Cargo feature so shipped binaries carry no runtime dependency
# on a pre-1.0 Optics SONAME. A linked development worktree copies
# .cargo/optics-local.toml to .cargo/config.toml, which patches these sources to
# ../optics/crates/* and sets `OPTICS_DYNAMIC=1` for fast shared-library
# iteration; downstream packagers that prefer shared system libraries can set
# `OPTICS_DYNAMIC=1` in the build environment.
optics-gfx = { git = "https://github.com/ming2k/optics", tag = "v0.0.87", features = ["static"] }
optics-gfx-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.87", features = ["static"] }
optics-scene = { git = "https://github.com/ming2k/optics", tag = "v0.0.87", features = ["static"] }
optics-scene-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.87", features = ["static"] }
# optics-ui (immediate-mode UI engine) is the Chrome layer above the graphics
# canvas: layout, widget store, damage tracking, and the accessibility tree.
optics-ui = { git = "https://github.com/ming2k/optics", tag = "v0.0.87", features = ["static"] }
optics-ui-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.87", features = ["static"] }
# optics-material (backdrop materials on the gfx effect runtime) draws the
# frosted and liquid-glass chrome materials (ADR-0253). Only the compositor
# links it, and its filters exist only while such a material is in effect.
optics-material = { git = "https://github.com/ming2k/optics", tag = "v0.0.87", features = ["static"] }
optics-material-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.87", features = ["static"] }
# optics-motion (motion vocabulary; ADR-0172, Optics ADR-0170) provides analytic
# springs and easing; v0.0.53 adds the explicit `reduced_motion` flag to every
# advance entry point. Header-only on the C side and pure Safe Rust here
# (Optics ADR-0158), so there is no optics-motion-sys FFI crate and no native
# library to discover or rpath.
optics-motion = { git = "https://github.com/ming2k/optics", tag = "v0.0.87" }
# optics-svg-sys (Optics ADR-0170) propagates link and rpath metadata for the
# native `liboptics_svg` library linked internally by `optics-ui` for built-in
# widget glyphs. Theme and application SVG assets decode through system
# `librsvg-2.0` + `cairo` inside `tessera-assets` (ADR-0261).
optics-svg-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.87", features = ["static"] }

# Observability: crates emit through the `log` facade; each binary installs a
# `tracing`-based subscriber through the shared `tessera-env` crate, which
# bridges `log::` records into structured spans and fields (ADR-0079).
# Long-term this seam is also how the AI-adaptation phase subscribes to
# compositor events.
log = "0.4"

# tessera-mcp is the platform's MCP bridge. tessera exposes the bridge so any
# agent can discover scoped desktop and Interaction Domain tools without
# linking an agent stack into the compositor (ADR-0047, ADR-0087).
flate2 = "1"
sha2 = "0.10"

# Direct-display backend: drm-rs provides atomic KMS, libseat mediates
# privileged device access/session switching, and input is the maintained
# libinput wrapper. Keep the libinput feature pinned to the host ABI floor we
# build and test against rather than relying on its crate defaults.
drm = "0.15"
libseat = { version = "0.2.4", default-features = false }
input = { version = "0.10", default-features = false, features = [
    "udev",
    "log",
    "libinput_1_30",
] }
udev = "0.9"
libc = "0.2"

# Shared, effect-free Tessera state and deterministic state rules (ADR-0155).
# Pure presentation-domain value layer: frame damage verdicts, slot-ring
# repaint history, and the client-damage generation diff seam.
# Transport-neutral Actor authority, sessions, and exact resource grants.
tessera-authority = { path = "crates/tessera-authority" }
# Shared process environment (observability init, panic hooks, runtime
# directories, and socket hygiene) installed once by every executable.
# Library crates keep using the `log` facade and never link this.
tessera-env = { path = "crates/tessera-env" }
tessera-wayland-protocols = { path = "crates/tessera-wayland-protocols" }
tessera-wayland = { path = "crates/tessera-wayland" }
tessera-platform = { path = "crates/tessera-platform" }
tessera-composite = { path = "crates/tessera-composite" }
# Unified display server and compositing engine (ADR-0156).
tessera-shell = { path = "crates/tessera-shell", default-features = false }
# Product-specific design tokens, themes, and materials shared by chrome.
tessera-design = { path = "crates/tessera-design" }
# Locale negotiation and the typed translated message catalog for chrome.
tessera-i18n = { path = "crates/tessera-i18n" }
# Persona/avatar runtime: profile contract plus the feature-gated still/VRM
# portrait, motion, and hot-reload pipeline (ADR-0080, ADR-0096).
tessera-avatar = { path = "crates/tessera-avatar" }
# Compositor wallpaper: image, video, 3D, and multi-plane parallax backgrounds.
tessera-wallpaper = { path = "crates/tessera-wallpaper" }
# First-party session products. The compositor retains the protocol and
# fail-closed authority; these packages are ordinary Wayland clients.
tessera-lock = { path = "crates/tessera-lock" }
tessera-idle = { path = "crates/tessera-idle" }
# Tessera's Miracast caster (ADR-0192): an out-of-process WFD session, staged.
# It is a ScreenCast portal client and holds no compositor scope; the
# compositor never links it.
tessera-cast = { path = "crates/tessera-cast" }
# Backend-neutral network vocabulary and the compositor <-> network service
# protocol (ADR-0242). Pure: no zbus, no system daemon access.
tessera-network = { path = "crates/tessera-network" }
# The network service: NetworkManager and iwd backends plus `tessera-networkd`.
# The compositor never links this package.
tessera-network-system = { path = "crates/tessera-network-system" }
# Configuration: versioned TOML schema, loader, and live reload (ADR-0026).
tessera-config = { path = "crates/tessera-config" }
# Domain-oriented session control and command dispatch used by the `tessera` binary.
tessera-control = { path = "crates/tessera-control" }
# tessera-mcp: the scoped Tessera platform bridge over MCP — the standard agent
# access point (ADR-0047, ADR-0087). It is an out-of-process adapter any MCP
# client can spawn; the compositor never links it.
tessera-mcp = { path = "crates/tessera-mcp" }
# Shared test infrastructure. Test-only dependency; never linked by production.
tessera-test-support = { path = "crates/tessera-test-support" }

# Declarative configuration (ADR-0026). `serde` drives the schema; `toml` is
# the chosen file format over KDL/YAML/INI for tooling maturity and an
# unambiguous grammar. `serde_json` is the IPC wire format (ADR-0027):
# human-debuggable and schema-driven, distinct from adopting the i3 protocol.
serde = { version = "1", features = ["derive"] }
# toml 1.x shares the toml_parser/toml_datetime/winnow 1.x stack with the
# toml_edit 0.25 line used by tessera-config, so the old toml_edit 0.22 /
# toml_datetime 0.6 / winnow 0.7 copies drop out of the graph.
toml = "1"
serde_json = "1"

# Standalone first-party Wayland clients. The system backend is required by
# tessera-lock because Vulkan needs the native wl_display/wl_surface pointers.
wayland-client = { version = "0.31.14", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = [
    "client",
    "staging",
    "unstable",
] }
ash = "0.38"
xkbcommon = "0.8"
zeroize = "1.8"

# CLI, automation, and shared utility tooling
tempfile = "3"
# Property-based testing for the wire schema. The IPC wire is a versioned
# serde surface with strict tags and serde-defaulted fields; generated
# round-trips catch attribute regressions that example tests miss.
proptest = "1"
toml_edit = "0.25"
cc = "1"
pkg-config = "0.3"


[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

# High-computation graphics kernels benefit from optimization even in dev
# builds to prevent frame drops, while macro crates stay unoptimized so they
# do not serialize Cargo's dependency graph during compilation (ADR-0206).
[profile.dev.package]
tessera-image = { opt-level = 2 }

# Dependencies change infrequently; opt-level 1 provides sufficient inlining
# and performance without incurring LLVM -O2 compilation pauses (ADR-0206).
[profile.dev.package."*"]
opt-level = 1

# Dedicated profiling & benchmark profile: avoids ThinLTO compile delays
# while maintaining near-release runtime speed with full debug symbols.
[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16

# Release builds favor a smaller binary: thin LTO plus a single codegen unit
# deduplicates generics across crate boundaries, and the symbol table is
# stripped. Panic messages still carry file:line, but stripped binaries
# resolve no function names in backtraces — keep that in mind when debugging
# production crashes.
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"

# Practical exceptions for GUI / UI and complex protocol models
too_many_arguments = "allow"
enum_variant_names = "allow"
large_enum_variant = "allow"
