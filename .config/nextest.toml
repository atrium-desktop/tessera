# .config/nextest.toml
# Nextest execution and scheduling configuration for Tessera workspace.

# Setup scripts run one command before a filtered set of tests. Enabling the
# feature here (rather than asking every contributor to pass a flag) keeps a
# single documented invocation for the root suites.
experimental = ["setup-scripts"]

[profile.default]
# Kill hung tests after 30s to prevent infinite deadlocks in local test runs
slow-timeout = { period = "30s", terminate-after = 1 }
retries = 0

[profile.ci]
# Generous timeout on CI runners with retries on transient scheduler jitter
slow-timeout = { period = "60s", terminate-after = 1 }
retries = 1
failure-output = "immediate-final"

[scripts.setup.workspace-binaries]
# The root suites spawn the production binaries as separate processes. Cargo
# does not build a dependency package's binaries for `cargo nextest run`, and a
# test must never run `cargo build` itself: the run already holds the target
# directory lock, so a nested build waits on that lock until the test timeout
# kills it. Build the siblings once, before any test starts.
command = "cargo build --locked --workspace --bins"

[test-groups]
# Single-thread execution group for tests that bind exclusive hardware/system resources
# (e.g. DRM devices, KMS leases, mock IPC domain sockets, PAM authentication sessions)
exclusive-system-tests = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(tessera-platform) or package(tessera-ipc)'
test-group = 'exclusive-system-tests'

# The root integration suite carries the IPC loopback tests formerly owned by
# tessera-ipc. Keep the same single-thread exclusion for socket/hardware-like
# resources even though they now share one test binary.
[[profile.default.overrides]]
filter = 'package(tessera-tests) and test(ipc::)'
test-group = 'exclusive-system-tests'

# Prioritize heavy/long-running compositor and renderer test suites first
# to maximize multi-core worker pool utilization and minimize the tail latency.
[[profile.default.overrides]]
filter = 'package(tessera-wayland) or package(tessera-composite) or package(tessera-shell) or package(tessera-tests)'
priority = 100

# Every profile that runs the root suites needs the sibling binaries.
[[profile.default.scripts]]
filter = 'package(tessera-tests) and test(/^(command_entry|display_mirror|cast_networkmanager|tray_smoke)::|mcp_bridge::stdio_discovers/)'
platform = "cfg(unix)"
setup = "workspace-binaries"

[[profile.ci.scripts]]
filter = 'package(tessera-tests) and test(/^(command_entry|display_mirror|cast_networkmanager|tray_smoke)::|mcp_bridge::stdio_discovers/)'
platform = "cfg(unix)"
setup = "workspace-binaries"
