[package]
name = "tessera-cast"
description = "Tessera Miracast caster: WFD session over a session-scoped virtual output (ADR-0192)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "tessera_cast"
path = "src/lib.rs"

[[bin]]
name = "tessera-cast"
path = "src/bin/tessera-cast.rs"

[[bin]]
name = "tessera-castd"
path = "src/bin/tessera-castd.rs"

[dependencies]
# Shared runtime-environment resolution (observability init, panic hooks,
# runtime directories) — ADR-0147.
tessera-env.workspace = true
# Backend-neutral cast vocabulary (`CastStatus`, `CastSink`, `CastSession`) so
# the compositor and this service share one model (ADR-0190, ADR-0192).
tessera-desktop.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# The system D-Bus client for iwd's P2P/WFD interfaces. The same zbus seam the
# session tray already uses; no new D-Bus dependency family (ADR-0192).
zbus.workspace = true

[lints]
workspace = true
