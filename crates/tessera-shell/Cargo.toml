[package]
name = "tessera-shell"
description = "Compositor chrome host and contract: Shell, Chrome, launcher, workspaces, decorations, and notifications"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["full-chrome"]
full-chrome = ["chrome-dock", "chrome-pivot", "chrome-control-center", "chrome-accessibility"]
chrome-dock = []
chrome-accessibility = ["dep:zbus"]
chrome-pivot = ["dep:tessera-launch-services"]
# PNG decoding for the Agent feedback pointer sprites. Its own feature because
# the sprites are not a tray concern: the tray feature merely happens to be
# the one that always wanted them.
agent-sprites = ["dep:image"]
chrome-tray = ["agent-sprites", "dep:tessera-launch-services", "dep:zbus"]
chrome-control-center = ["chrome-tray", "persona"]
# Full personalized portrait runtime preview example.
persona = [
    "dep:tessera-avatar",
]

[[example]]
name = "debug_avatar"
required-features = ["persona"]

[dependencies]
tessera-launch-services = { workspace = true, optional = true }
image = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }
vista-sys.workspace = true
# Direct dep so this crate's build script receives DEP_TRANSIT_RPATHS (published
# via transit-sys's `links` metadata) and can re-emit the rpath — otherwise the
# test/example harness loads a stale system libtransit instead of the local build.
transit-sys = { workspace = true }
tessera-authority.workspace = true
tessera-desktop.workspace = true
tessera-primitives.workspace = true
tessera-design = { workspace = true }
tessera-i18n = { workspace = true }
tessera-avatar = { workspace = true, optional = true, features = ["persona"] }
flux = { workspace = true }
flux-sys = { workspace = true }
lens = { workspace = true }
svg = { workspace = true }
lens-sys = { workspace = true }
svg-sys = { workspace = true }
transit = { workspace = true }
log.workspace = true
thiserror.workspace = true
# statvfs for the resource probe's root-filesystem usage sample.
libc.workspace = true
# The secret prompt's edit buffer is zeroized on close (password hygiene).
zeroize = { workspace = true }
include_dir = { workspace = true }

[dev-dependencies]
# `.svgz` fixtures are gzip streams, built in process by the tests.
flate2 = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["flux-sys", "lens-sys", "svg-sys", "vista-sys", "transit-sys"]

[lints]
workspace = true

# A real-session-bus smoke test: it binds zbus and the tray service, so it can
# only build where that service is compiled in.
[[test]]
name = "tray_smoke"
required-features = ["chrome-tray"]
