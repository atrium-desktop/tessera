[package]
name = "tessera-shell"
description = "Compositor chrome host and contract: Shell, Chrome, launcher, workspaces, decorations, and notifications"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["full-chrome"]
full-chrome = ["chrome-dock", "chrome-pivot", "chrome-control-center", "chrome-accessibility"]
chrome-dock = []
chrome-accessibility = ["dep:tessera-dbus"]
chrome-pivot = ["dep:tessera-launch-services"]
# Theme-asset decoding for Agent feedback sprites and tray icons. Its own
# feature because the sprites are not a tray concern (ADR-0233).
agent-sprites = ["dep:tessera-assets"]
chrome-tray = ["agent-sprites", "dep:tessera-launch-services", "dep:tessera-dbus", "dep:tessera-assets"]
chrome-control-center = ["chrome-tray", "persona"]
# Full personalized portrait runtime preview example.
persona = [
    "dep:tessera-avatar",
]

[[example]]
name = "debug_avatar"
required-features = ["persona"]

[dependencies]
tessera-launch-services = { workspace = true, optional = true }
tessera-assets = { workspace = true, optional = true }
tessera-dbus = { workspace = true, optional = true }
optics-vista-sys.workspace = true
tessera-authority.workspace = true
tessera-desktop.workspace = true
tessera-primitives.workspace = true
tessera-design = { workspace = true }
tessera-i18n = { workspace = true }
tessera-avatar = { workspace = true, optional = true, features = ["persona"] }
optics-flux = { workspace = true }
optics-flux-sys = { workspace = true }
optics-lens = { workspace = true }
optics-lens-sys = { workspace = true }
# Direct dep so this crate's build script receives DEP_RETICLE_RPATHS for the
# test harness; the decoder itself lives in `tessera-assets` (ADR-0233).
optics-reticle-sys = { workspace = true }
optics-transit = { workspace = true }
log.workspace = true
# statvfs for the resource probe's root-filesystem usage sample.
libc.workspace = true
# The secret prompt's edit buffer is zeroized on close (password hygiene).
zeroize = { workspace = true }

[dev-dependencies]
# `.svgz` fixtures are gzip streams, built in process by the tests.
flate2 = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["optics-flux-sys", "optics-lens-sys", "optics-reticle-sys", "optics-vista-sys"]

[lints]
workspace = true
