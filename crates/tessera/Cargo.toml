[package]
name = "tessera"
description = "autonomous surface shell — a Wayland compositor"
readme = "README.md"
version.workspace = true
edition.workspace = true
# The compositor binary embeds the original MIT-licensed cursor theme under
# assets/cursors.
license.workspace = true
rust-version.workspace = true

[features]
# Packaged builds retain the complete compositor chrome. Integrators can
# disable the default and select only the independently compiled components
# required by their product without changing the shared shell contract.
default = ["full-chrome"]
full-chrome = [
    "chrome-dock",
    "chrome-pivot",
    "chrome-hud",
    "chrome-control-center",
]
chrome-dock = ["tessera-shell/chrome-dock"]
chrome-pivot = ["tessera-shell/chrome-pivot"]
# The composition root owns the single tray service used by either surface.
chrome-hud = ["tessera-shell/chrome-hud", "dep:tessera-tray"]
chrome-control-center = ["tessera-shell/chrome-control-center", "dep:tessera-tray"]

[dependencies]
thiserror = { workspace = true }
tessera-cli = { workspace = true }
tessera-desktop.workspace = true
tessera-scene.workspace = true
tessera-types.workspace = true
tessera-ipc.workspace = true
tessera-protocol.workspace = true
tessera-audit.workspace = true
tessera-authority.workspace = true
tessera-semantic.workspace = true
tessera-render = { workspace = true }
# Design tokens: scene colors and glass material policy (single source).
tessera-design = { workspace = true }
tessera-wayland = { workspace = true }
tessera-platform = { workspace = true }
tessera-shell = { workspace = true, default-features = false }
# The Chrome contract consumed by the runtime's chrome driving code.
tessera-i18n = { workspace = true }
# Chrome components split out of tessera-shell (ADR-0044); only the binary
# composes them into the shell.
# SNI tray service shared by the HUD and the control center (ADR-0080).
tessera-tray = { workspace = true, optional = true }
# Modal control center (ADR-0080).
tessera-wallpaper = { workspace = true }
# Declarative configuration: TOML schema + live reload (ADR-0026).
tessera-config = { workspace = true }
# IPC and introspection surface (ADR-0027).
# Native resource commands dispatched through the same executable.
# Launcher: enumerate `.desktop` entries and spawn them detached (ADR-0022, ADR-0160).
# Only the binary wires these; tessera-shell and tessera-render stay free of them.
tessera-apps = { workspace = true }
flux = { workspace = true }
lens = { workspace = true }
# Liquid-glass material compositor (ADR-0063 moved it out of flux).
prism = { workspace = true }
image = { workspace = true }
libc = { workspace = true }
# SVG cursor rasterization for the software cursor (ADR-0070). Pure Rust,
# with text/raster-image features off since the bundled cursor art is
# path/fill/stroke only.
resvg = { workspace = true }
usvg = { workspace = true }
tiny-skia = { workspace = true }
# Embeds the bundled Tessera cursor theme as the default fallback.
include_dir = { workspace = true }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
log.workspace = true
tracing.workspace = true
tessera-bootstrap.workspace = true
zbus = { workspace = true }
# Direct deps purely so this binary's build script receives DEP_FLUX_RPATHS /
# DEP_LENS_RPATHS (published via the -sys crates' `links` metadata) and can
# re-emit the rpaths — `rustc-link-arg` does not propagate across crates.
flux-sys = { workspace = true }
flux-scene-graph-sys = { workspace = true }
lens-sys = { workspace = true }
prism-sys = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["flux-scene-graph-sys", "lens-sys", "prism-sys"]

[dev-dependencies]
tessera-desktop = { workspace = true }
tessera-ipc = { workspace = true }
tessera-protocol = { workspace = true }
tempfile = "3"
# Chrome-host integration tests render components through the real shell.
tessera-shell = { workspace = true, default-features = false }

[lints]
workspace = true
