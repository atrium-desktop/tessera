[package]
name = "tessera"
description = "autonomous surface shell — a Wayland compositor"
readme = "README.md"
version.workspace = true
edition.workspace = true
publish = false
# The compositor binary embeds the original MIT-licensed cursor theme under
# assets/cursors.
license.workspace = true
rust-version.workspace = true

[features]
# Packaged builds retain the complete compositor chrome. Integrators can
# disable the default and select only the independently compiled components
# required by their product without changing the shared shell contract.
default = ["full-chrome"]
full-chrome = [
    "chrome-dock",
    "chrome-pivot",
    "chrome-control-center",
]
chrome-dock = ["tessera-shell/chrome-dock"]
chrome-pivot = ["tessera-shell/chrome-pivot"]
chrome-control-center = ["tessera-shell/chrome-control-center"]
dbus-system = ["dep:tessera-dbus"]

[dependencies]
tessera-control = { workspace = true }
tessera-cast = { workspace = true }
tessera-desktop.workspace = true
tessera-primitives.workspace = true
tessera-ipc.workspace = true
tessera-protocol.workspace = true
tessera-audit.workspace = true
tessera-authority.workspace = true
tessera-composite = { workspace = true }
# Design tokens: scene colors and glass material policy (single source).
tessera-design = { workspace = true }
tessera-wayland = { workspace = true }
tessera-platform = { workspace = true }
tessera-shell = { workspace = true, default-features = false }
# Chrome components split out of tessera-shell (ADR-0044); only the binary
# composes them into the shell.
# Modal control center (ADR-0080).
tessera-wallpaper = { workspace = true }
# Declarative configuration: TOML schema + live reload (ADR-0026).
tessera-config = { workspace = true }
# IPC and introspection surface (ADR-0027).
# Native resource commands dispatched through the same executable.
# Launcher: enumerate `.desktop` entries and spawn them detached (ADR-0022, ADR-0160).
# Only the binary wires these; tessera-shell and tessera-composite stay free of them.
tessera-launch-services = { workspace = true }
# Backend-neutral network snapshots and the network service protocol
# (ADR-0242). The compositor never links the system-D-Bus network backend.
tessera-network = { workspace = true }
# One theme-asset decoder for application icons, HUD symbols and cursors.
tessera-assets = { workspace = true }
optics-gfx = { workspace = true }
optics-ui = { workspace = true }
libc = { workspace = true }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
log.workspace = true
tessera-env.workspace = true
tessera-dbus = { workspace = true, optional = true }
# Direct deps purely so this binary's build script receives DEP_OPTICS_GFX_RPATHS /
# DEP_OPTICS_UI_RPATHS (published via the -sys crates' `links` metadata) and can
# re-emit the rpaths — `rustc-link-arg` does not propagate across crates.
optics-gfx-sys = { workspace = true }
optics-scene-sys = { workspace = true }
optics-ui-sys = { workspace = true }
optics-svg-sys = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["optics-scene-sys", "optics-svg-sys"]

[dev-dependencies]
# `.svgz` fixtures are gzip streams; the tests build them in process.
flate2 = { workspace = true }
# Tests encode PNG fixtures; production code decodes through `tessera-assets`.
tessera-image = { workspace = true }
tessera-desktop = { workspace = true }
tessera-ipc = { workspace = true }
tessera-protocol = { workspace = true }
tempfile = { workspace = true }
# Chrome-host integration tests render components through the real shell.
tessera-shell = { workspace = true, default-features = false }

[lints]
workspace = true
