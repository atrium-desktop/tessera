[package]
name = "tessera-avatar"
description = "Personalized profile and portrait runtime: local account defaults, still/VRM portrait pipeline, motion playback, and hot reload"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# XDG portrait asset discovery.
tessera-launch-services = { workspace = true }
# POSIX account lookups (getpwuid) for the local profile defaults.
libc = { workspace = true }
# GPU texture upload path shared with the compositor.
optics-flux = { workspace = true }
optics-flux-sys = { workspace = true, optional = true }
optics-vista = { workspace = true, optional = true }
optics-vista-sys = { workspace = true, optional = true }
tessera-image = { workspace = true, optional = true }
log.workspace = true

[features]
default = []
# Full portrait runtime. The lightweight `persona::Profile` contract remains
# available without this feature.
persona = [
    "dep:optics-flux-sys",
    "dep:optics-vista",
    "dep:optics-vista-sys",
    "dep:tessera-image",
]

[package.metadata.cargo-machete]
ignored = ["optics-vista-sys", "optics-flux-sys"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
