[package]
name = "tessera-avatar"
description = "Personalized profile and portrait runtime: local account defaults, still/VRM portrait pipeline, motion playback, and hot reload"
readme = "README.md"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

[dependencies]
# XDG portrait asset discovery.
tessera-launch-services = { workspace = true }
# POSIX account lookups (getpwuid) for the local profile defaults.
libc = { workspace = true }
# GPU texture upload path shared with the compositor.
optics-gfx = { workspace = true }
optics-gfx-sys = { workspace = true, optional = true }
tessera-scene = { workspace = true, optional = true }
tessera-image = { workspace = true, optional = true }
log.workspace = true

[features]
default = []
# Full portrait runtime. The lightweight `persona::Profile` contract remains
# available without this feature.
persona = [
    "dep:optics-gfx-sys",
    "dep:tessera-scene",
    "dep:tessera-image",
]

[package.metadata.cargo-machete]
ignored = ["optics-gfx-sys"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
