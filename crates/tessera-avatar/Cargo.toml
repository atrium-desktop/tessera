[package]
name = "tessera-avatar"
description = "Personalized profile and portrait runtime: local account defaults, still/VRM portrait pipeline, motion playback, and hot reload"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# XDG portrait asset discovery.
tessera-launch-services = { workspace = true }
# POSIX account lookups (getpwuid) for the local profile defaults.
libc = { workspace = true }
# GPU texture upload path shared with the compositor.
flux = { workspace = true }
flux-sys = { workspace = true, optional = true }
vista = { workspace = true, optional = true }
vista-sys = { workspace = true, optional = true }
image = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
fastrand = { workspace = true, optional = true }
lens = { workspace = true }
log.workspace = true
thiserror.workspace = true

[features]
default = []
# Full portrait runtime. The lightweight `persona::Profile` contract remains
# available without this feature.
persona = [
    "dep:fastrand",
    "dep:flux-sys",
    "dep:vista",
    "dep:vista-sys",
    "dep:image",
    "dep:notify",
]

[package.metadata.cargo-machete]
ignored = ["vista-sys", "flux-sys"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
