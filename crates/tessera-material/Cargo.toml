[package]
name = "tessera-material"
description = "Frosted and liquid-glass backdrop materials on the Optics gfx effect runtime"
readme = "README.md"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true
build = "build.rs"
links = "tessera_material"

[dependencies]
optics-gfx = { workspace = true }
optics-gfx-sys = { workspace = true }

[build-dependencies]
optics-build = { workspace = true }
cc.workspace = true
pkg-config.workspace = true

[features]
# Mirror the Optics link-mode feature: the vendored C filters link gfx the
# same way the rest of the workspace does.
static = ["optics-gfx/static", "optics-gfx-sys/static"]

[lints]
workspace = true
