[package]
name = "tessera-assets"
description = "Theme asset decoding: vector sources and premultiplied-BGRA rasters for the renderer"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flate2.workspace = true
tessera-image.workspace = true
optics-reticle.workspace = true
# Direct dep so the test harness receives DEP_RETICLE_RPATHS from the `-sys`
# crate's `links = "reticle"` metadata (the same relay `tessera-shell` uses).
optics-reticle-sys.workspace = true

[package.metadata.cargo-machete]
# Native rpath metadata for the test harness; not referenced from source.
ignored = ["optics-reticle-sys"]

[lints]
workspace = true
