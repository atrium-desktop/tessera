[package]
name = "tessera-lock"
description = "First-party secure session locker for the Tessera desktop"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = []
dev-preview = []

[[bin]]
name = "tessera-lock"
path = "src/main.rs"

[[bin]]
name = "tessera-lock-preview"
path = "src/preview_main.rs"
required-features = ["dev-preview"]

[dependencies]
tessera-config.workspace = true
tessera-design.workspace = true
tessera-avatar = { workspace = true, features = ["persona"] }
tessera-wallpaper.workspace = true
ash.workspace = true
tessera-env.workspace = true
optics-flux.workspace = true
optics-flux-sys.workspace = true
optics-vista-sys.workspace = true
optics-lens.workspace = true
optics-lens-sys.workspace = true
libc.workspace = true
log.workspace = true
tessera-wl-client.workspace = true
# wayland-backend stays out of the manifest: wayland-client's "system"
# feature already enables wayland-backend/client_system.
wayland-client.workspace = true
wayland-protocols.workspace = true
xkbcommon.workspace = true
zeroize.workspace = true

[build-dependencies]
pkg-config.workspace = true

[package.metadata.cargo-machete]
ignored = ["optics-flux-sys", "optics-vista-sys", "optics-lens-sys", "pkg-config"]

[lints]
workspace = true
