[package]
name = "tessera-bootstrap"
description = "Shared process bootstrap for Tessera executables: observability init, panic hooks, runtime directories, and socket hygiene"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Only tracing-log and tracing-subscriber are named here: the crate bridges
# `log::` records through tracing_log::LogTracer without referencing the `log`
# or `tracing` crates directly.
[dependencies]
tracing-log.workspace = true
tracing-subscriber.workspace = true
# Typed runtime-environment errors.
thiserror.workspace = true
# The panic hook emits through the `log` facade (the bridge routes it
# into the subscriber), so the dependency is named explicitly here.
log.workspace = true

[dev-dependencies]
# The conformance suite asserts the socket-naming composition with the
# IPC contract (ADR-0147 Decision 6).
tessera-ipc.workspace = true

[lints]
workspace = true
