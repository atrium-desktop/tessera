[package]
name = "tessera-wallpaper"
description = "Compositor wallpaper: image, video, 3D, and multi-plane parallax backgrounds"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
optics-flux = { workspace = true }
optics-flux-sys = { workspace = true }
optics-vista = { workspace = true }
optics-vista-sys = { workspace = true }
optics-transit = { workspace = true }
tessera-image = { workspace = true }
log.workspace = true

[package.metadata.cargo-machete]
ignored = ["optics-vista-sys", "optics-flux-sys"]

[lints]
workspace = true

[dev-dependencies]
# The deferred-effect materialization boundary (Optics ADR-0147). Production
# wallpaper layers composite no effect outputs, so this edge exists only for
# the live-blur test that exercises the contract.
tessera-composite.workspace = true
