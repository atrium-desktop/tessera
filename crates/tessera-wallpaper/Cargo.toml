[package]
name = "tessera-wallpaper"
description = "Compositor wallpaper: image, video, 3D, and multi-plane parallax backgrounds"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flux = { workspace = true }
flux-sys = { workspace = true }
vista = { workspace = true }
vista-sys = { workspace = true }
transit = { workspace = true }
# Direct dep so this crate's build script receives DEP_TRANSIT_RPATHS
# (published via transit-sys's `links` metadata) and can re-emit the rpath.
transit-sys = { workspace = true }
image = { workspace = true }
log.workspace = true
thiserror.workspace = true
# Realtime scheduling: tag the video reader as a frame feeder.
tessera-sched.workspace = true

[package.metadata.cargo-machete]
ignored = ["vista-sys", "flux-sys", "transit-sys"]

[lints]
workspace = true

[dev-dependencies]
# The deferred-effect materialization boundary (Optics ADR-0147). Production
# wallpaper layers composite no effect outputs, so this edge exists only for
# the live-blur test that exercises the contract.
tessera-composite.workspace = true
