[package]
name = "tessera-settings"
description = "Tessera Settings: the standalone application that edits the compositor's persistent settings"
readme = "README.md"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = []
dev-preview = []

[[bin]]
name = "tessera-settings"
path = "src/main.rs"

[[bin]]
name = "tessera-settings-preview"
path = "src/preview_main.rs"
required-features = ["dev-preview"]

[dependencies]
ash.workspace = true
optics-gfx.workspace = true
optics-gfx-sys.workspace = true
optics-ui.workspace = true
optics-ui-sys.workspace = true
libc.workspace = true
log.workspace = true
tessera-design.workspace = true
tessera-wl-client.workspace = true
tessera-desktop.workspace = true
tessera-env.workspace = true
tessera-i18n.workspace = true
tessera-ipc.workspace = true
tessera-primitives.workspace = true
tessera-protocol.workspace = true
optics-scene-sys.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true

[build-dependencies]
pkg-config.workspace = true

[package.metadata.cargo-machete]
ignored = ["optics-gfx-sys", "optics-scene-sys", "optics-ui-sys", "pkg-config"]

[lints]
workspace = true
