# ADR-0159. Explicit capability edges; no default/unrestricted role.
# Review changes here alongside the owning package manifest.

[tessera]
normal = ["optics-gfx", "optics-gfx-sys", "optics-ui", "optics-ui-sys", "libc", "log", "optics-svg-sys", "serde", "serde_json", "sha2", "tessera-assets", "tessera-audit", "tessera-authority", "tessera-cast", "tessera-control", "tessera-composite", "tessera-config", "tessera-dbus", "tessera-design", "tessera-desktop", "tessera-env", "tessera-ipc", "tessera-launch-services", "tessera-network", "tessera-platform", "tessera-primitives", "tessera-protocol", "tessera-shell", "tessera-wallpaper", "tessera-wayland", "optics-scene-sys", "zeroize"]
build = []
dev = ["flate2", "tessera-image", "tempfile", "tessera-desktop", "tessera-ipc", "tessera-protocol", "tessera-shell"]

[tessera-assets]
normal = ["flate2", "tessera-image", "optics-svg", "optics-svg-sys"]
build = []
dev = []

[tessera-launch-services]
normal = ["libc", "log", "tessera-desktop", "tessera-i18n"]
build = []
dev = ["tempfile"]

[tessera-audit]
normal = ["flate2", "hmac", "libc", "serde", "serde_json", "sha2", "tessera-protocol", "zeroize"]
build = []
dev = ["tempfile"]

[tessera-authority]
normal = ["serde", "serde_json", "tessera-desktop", "tessera-primitives", "zeroize"]
build = []
dev = []

[tessera-avatar]
normal = ["optics-gfx", "optics-gfx-sys", "tessera-image", "libc", "log", "tessera-launch-services", "optics-scene", "optics-scene-sys"]
build = []
dev = ["tempfile"]

[tessera-platform]
normal = ["ash", "drm", "optics-gfx", "optics-gfx-sys", "input", "libc", "libseat", "log", "tessera-desktop", "tessera-primitives", "tessera-wayland-protocols", "udev"]
build = ["pkg-config"]
dev = []

[tessera-env]
normal = ["libc", "log"]

[tessera-dbus]
normal = ["libc"]
build = []
dev = []

[tessera-wl-client]
normal = ["libc", "wayland-client", "xkbcommon"]
build = []
dev = []

[tessera-control]
normal = ["serde", "serde_json", "tessera-audit", "tessera-authority", "tessera-config", "tessera-desktop", "tessera-env", "tessera-i18n", "tessera-ipc", "tessera-launch-services", "tessera-primitives", "tessera-protocol", "zeroize"]
build = []
dev = ["tempfile"]

[tessera-config]
normal = ["libc", "serde", "tessera-desktop", "tessera-network", "tessera-primitives", "toml", "toml_edit"]
build = []
dev = ["tempfile"]

[tessera-design]
normal = ["optics-ui", "optics-ui-sys", "tessera-desktop"]
build = []
dev = []

[tessera-desktop]
normal = ["serde", "tessera-primitives"]
build = []
dev = ["serde_json"]

[tessera-i18n]
normal = ["serde", "toml"]
build = []
dev = []

[tessera-idle]
normal = ["libc", "log", "tessera-dbus", "tessera-desktop", "tessera-env", "tessera-ipc", "tessera-protocol", "wayland-client", "wayland-protocols"]
build = []
dev = []

[tessera-cast]
normal = ["libc", "log", "serde", "serde_json", "tessera-dbus", "tessera-desktop", "tessera-env"]
build = []
dev = []

# Backend-neutral network vocabulary and the compositor <-> service protocol
# (ADR-0242). Pure: zbus and system D-Bus are deliberately absent.
[tessera-network]
normal = ["libc", "serde", "serde_json", "tessera-desktop", "zeroize"]
build = []
dev = ["tempfile"]

# The system-side network service. The compositor never depends on this package;
# `check-boundaries` enforces that only the daemon and its tests see it.
[tessera-network-system]
normal = ["libc", "log", "tessera-dbus", "tessera-desktop", "tessera-env", "tessera-network", "zeroize"]
build = []
dev = ["tempfile"]

[tessera-ipc]
normal = ["libc", "serde", "serde_json", "tessera-authority", "tessera-desktop", "tessera-primitives", "tessera-protocol", "zeroize"]
build = []
dev = ["tempfile"]

[tessera-lock]
normal = ["ash", "optics-gfx", "optics-gfx-sys", "optics-ui", "optics-ui-sys", "libc", "log", "tessera-avatar", "tessera-config", "tessera-design", "tessera-env", "tessera-wallpaper", "tessera-wl-client", "optics-scene-sys", "wayland-client", "wayland-protocols", "zeroize"]
build = ["pkg-config"]
dev = []

[tessera-mcp]
normal = ["serde", "serde_json", "tessera-authority", "tessera-desktop", "tessera-env", "tessera-ipc", "tessera-launch-services", "tessera-primitives", "tessera-protocol"]
build = []
dev = []

[tessera-protocol]
normal = ["serde", "serde_json", "tessera-authority", "tessera-desktop", "tessera-primitives", "zeroize"]
build = []
dev = ["proptest", "tessera-audit"]

[tessera-composite]
# Structured damage diagnostics are emitted with tracing; the binary installs
# the subscriber (ADR-0079, ADR-0230, ADR-0232).
normal = ["optics-gfx", "optics-gfx-sys", "tessera-image", "libc", "log", "tessera-desktop", "tessera-primitives"]
build = []
dev = ["proptest"]

[tessera-primitives]
normal = ["serde"]
build = []
dev = ["proptest"]

[tessera-settings]
normal = ["ash", "optics-gfx", "optics-gfx-sys", "optics-ui", "optics-ui-sys", "libc", "log", "tessera-design", "tessera-desktop", "tessera-env", "tessera-i18n", "tessera-ipc", "tessera-primitives", "tessera-protocol", "tessera-wl-client", "optics-scene-sys", "wayland-client", "wayland-protocols"]
build = ["pkg-config"]
dev = []

[tessera-shell]
normal = ["optics-gfx", "optics-gfx-sys", "optics-ui", "optics-ui-sys", "libc", "log", "optics-svg-sys", "tessera-assets", "tessera-authority", "tessera-avatar", "tessera-dbus", "tessera-design", "tessera-desktop", "tessera-i18n", "tessera-launch-services", "tessera-primitives", "optics-motion", "optics-scene-sys", "zeroize"]
build = []
dev = ["flate2"]

[tessera-wallpaper]
normal = ["optics-gfx", "optics-gfx-sys", "tessera-image", "log", "optics-motion", "optics-scene", "optics-scene-sys"]
build = []
dev = ["tessera-composite"]

[tessera-wayland]
# Structured damage diagnostics are emitted with tracing; the binary installs
# the subscriber (ADR-0079, ADR-0230, ADR-0232).
normal = ["log", "serde", "serde_json", "tessera-authority", "tessera-desktop", "tessera-primitives", "tessera-wayland-protocols", "xkbcommon"]
build = ["pkg-config"]
dev = ["proptest", "tempfile", "tessera-test-support"]

[tessera-wayland-protocols]
normal = []
build = ["cc"]
dev = []

# Shared test infrastructure. Dev-dependency only; production crates must not
# link it (ADR-0159 capability edges).
[tessera-test-support]
normal = ["tempfile"]
build = []
dev = []

# Root external suites: one integration entry and one end-to-end entry. Native
# dependencies are optional and gated by the `native` feature so native-free CI
# can compile the logical suites with --no-default-features.
[tessera-tests]
normal = ["libc", "serde_json", "tempfile", "tessera-audit", "tessera-authority", "tessera-cast", "tessera-control", "tessera-composite", "tessera-config", "tessera-desktop", "tessera-env", "tessera-ipc", "tessera-launch-services", "tessera-mcp", "tessera-primitives", "tessera-protocol", "tessera-shell", "tessera-test-support", "optics-gfx-sys", "optics-ui-sys", "optics-svg-sys", "optics-scene-sys", "tessera-dbus"]
build = []
dev = []

[xtask]
normal = ["serde", "serde_json", "toml", "toml_edit"]
build = []
dev = ["tempfile"]

[tessera-image]
build = []
dev = []
normal = []
